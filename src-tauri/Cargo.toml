[package]
name = "lingyunfrp-client-launcher"
version = "1.1.3"
description = "凌云FRP图形化客户端，更方便使用"
authors = ["LYFRP"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }
embed-resource = "3.0.5"

[dependencies]
reqwest = { version = "0.12.23", features = ["json", "multipart", "blocking", "stream"] }
tokio = { version = "1.47.1", features = ["full"] }
tauri = { version = "2.7.0", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.143"
tauri-plugin-notification = "2.3.1"
tauri-plugin-single-instance = { version = "2.3.3", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4.2"
base64 = "0.22.1"
regex = "1.11.1"
futures = "0.3.31"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
