# .github/workflows/trigger-build.yml (放在私有仓库，极简)
name: Trigger Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        default: "all"
        type: choice
        options: [all, macos, linux, windows]
      create_release:
        description: "Create Release"
        default: true
        type: boolean

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Public Build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}  # 只需 public_repo 权限
          script: |
            const ref = context.ref;
            const isTag = ref.startsWith('refs/tags/v');
            
            await github.rest.repos.createDispatchEvent({
              owner: 'your-username',           # 公共仓库所有者
              repo: 'your-app-build',          # 公共仓库名
              event_type: 'build-release',
              client_payload: {
                source_repo: context.repo.owner + '/' + context.repo.repo,
                ref: ref,
                is_tag: isTag,
                create_release: isTag || ${{ github.event.inputs.create_release == true }}
              }
            });
            
            console.log(`✅ Triggered build for ${context.repo.repo}@${ref}`);
