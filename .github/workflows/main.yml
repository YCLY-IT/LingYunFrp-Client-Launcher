name: Trigger Public Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platform:
        description: "Select platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - macos
          - linux
          - windows
      create_release:
        description: "Create GitHub Release"
        required: false
        default: true
        type: boolean

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Public Repository Build
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const isTag = context.ref.startsWith('refs/tags/v');
            const ref = context.ref;
            
            await github.rest.repos.createDispatchEvent({
              owner: 'YCLY-IT',
              repo: 'LingYunFrp-Official-Launcher',
              event_type: 'build-release',
              client_payload: {
                source_repo: context.repo.owner + '/' + context.repo.repo,
                ref: ref,
                platform: '${{ github.event.inputs.platform || 'all' }}',
                create_release: isTag || ${{ github.event.inputs.create_release == true }}
              }
            });
            
            console.log(`✅ Triggered build for ${context.repo.repo}@${ref}`);
            console.log(`   Platform: ${{ github.event.inputs.platform || 'all' }}`);
            console.log(`   Create Release: ${isTag || ${{ github.event.inputs.create_release == true }}}`);
